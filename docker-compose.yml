services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      # Required — no default; must be set in .env
      - DATABASE_URL=${DATABASE_URL}
      - AUTH_SECRET_KEY=${AUTH_SECRET_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      # Storage: "local" (default) or "s3"
      - STORAGE_PROVIDER=${STORAGE_PROVIDER:-local}
      # S3 settings — required when STORAGE_PROVIDER=s3 and no IAM instance role
      # Leave unset to use EC2 instance profile (recommended)
      - S3_BUCKET=${S3_BUCKET:-}
      - S3_REGION=${S3_REGION:-us-east-1}
      # Email / SES — set EMAIL_FROM to enable password-reset emails
      - EMAIL_FROM=${EMAIL_FROM:-}
      - EMAIL_AWS_REGION=${EMAIL_AWS_REGION:-us-east-1}
      # Auth — must be false in production or all routes bypass auth checks
      - AUTH_DEV_MODE=${AUTH_DEV_MODE:-false}
    volumes:
      # Local file storage (used when STORAGE_PROVIDER=local)
      - ./uploads:/app/uploads
      # ChromaDB vector store persistence
      - ./chromadb_data:/app/chromadb_data
    depends_on:
      postgres:
        condition: service_healthy
      chromadb:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

  chromadb:
    image: chromadb/chroma:latest
    ports:
      - "8001:8000"
    volumes:
      - ./chromadb_data:/chroma/chroma
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-media}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-media_indexing}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-media}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

