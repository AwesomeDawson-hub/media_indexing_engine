# Media Indexing Engine - Example Configuration
# Copy this file to settings.yaml and fill in your values.

app:
  name: "Media Indexing Engine"
  debug: false
  host: "0.0.0.0"
  port: 8000
  cors_origins:
    - "http://localhost:5173"    # Vite dev server

storage:
  provider: "local"  # local | s3 | gcs
  local_path: "./uploads"
  # s3_bucket: ""
  # s3_region: ""

database:
  url: "sqlite:///./media_index.db"

search:
  # Vector database for semantic search
  provider: "chromadb"  # chromadb (others via VectorStore interface)
  collection_name: "media_embeddings"
  embedding_model: "all-MiniLM-L6-v2"
  top_k: 20
  persist_directory: "./chromadb_data"

analysis:
  # Vision model provider
  provider: "anthropic"  # anthropic (others via VisionProvider interface)
  model: "claude-sonnet-4-20250514"
  max_image_dimension: 1568    # Max longest side for API submission
  max_concurrent: 5
  timeout_seconds: 60

auth:
  secret_key: "dev-secret-change-in-production"  # Override via AUTH_SECRET_KEY env var in production
  algorithm: "HS256"
  access_token_expire_minutes: 60
  dev_mode: true    # Set to false in production — requires JWT on all routes

deduplication:
  algorithm: "sha256"
  enabled: true
